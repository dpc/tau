[workspace]
members = [
  "crates/tau",
  "crates/tau-actions",
  "crates/tau-blocking-notify-channel",
  "crates/tau-cli",
  "crates/tau-cli-picker",
  "crates/tau-cli-term",
  "crates/tau-cli-term-raw",
  "crates/tau-client",
  "crates/tau-config",
  "crates/tau-core",
  "crates/tau-e2e-tests",
  "crates/tau-ext-pim",
  "crates/tau-ext-provider-builtin",
  "crates/tau-ext-rhai",
  "crates/tau-ext-shell",
  "crates/tau-ext-slack",
  "crates/tau-ext-std-notifications",
  "crates/tau-ext-telegram",
  "crates/tau-ext-test-dummy",
  "crates/tau-ext-utils",
  "crates/tau-ext-websearch",
  "crates/tau-ext-xmpp",
  "crates/tau-harness",
  "crates/tau-harness-tools",
  "crates/tau-proto",
  "crates/tau-provider",
  "crates/tau-provider-chat-completions",
  "crates/tau-provider-codex",
  "crates/tau-session-inspect",
  "crates/tau-skills",
  "crates/tau-socket",
  "crates/tau-supervisor",
  "crates/tau-term-screen",
  "crates/tau-test-support",
  "crates/tau-themes",
  "crates/tau-vcr",
]
resolver = "2"

[workspace.package]
categories = ["command-line-utilities", "development-tools"]
description = "A minimal Unix-first coding agent."
edition = "2024"
homepage = "https://github.com/dpc/tau-agent"
keywords = ["agent", "cli", "coding-agent", "llm"]
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/dpc/tau-agent"
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
httpdate = "1.0.3"
proptest = "1.7"
# Internal crates
tau-actions = { path = "crates/tau-actions" }
tau-blocking-notify-channel = { path = "crates/tau-blocking-notify-channel" }
tau-cli = { path = "crates/tau-cli" }
tau-cli-picker = { path = "crates/tau-cli-picker" }
tau-cli-term = { path = "crates/tau-cli-term" }
tau-cli-term-raw = { path = "crates/tau-cli-term-raw" }
tau-client = { path = "crates/tau-client" }
tau-config = { path = "crates/tau-config" }
tau-core = { path = "crates/tau-core" }
tau-ext-pim = { path = "crates/tau-ext-pim" }
tau-ext-provider-builtin = { path = "crates/tau-ext-provider-builtin" }
tau-ext-rhai = { path = "crates/tau-ext-rhai" }
tau-ext-shell = { path = "crates/tau-ext-shell" }
tau-ext-slack = { path = "crates/tau-ext-slack" }
tau-ext-std-notifications = { path = "crates/tau-ext-std-notifications" }
tau-ext-telegram = { path = "crates/tau-ext-telegram" }
tau-ext-test-dummy = { path = "crates/tau-ext-test-dummy" }
tau-ext-utils = { path = "crates/tau-ext-utils" }
tau-ext-websearch = { path = "crates/tau-ext-websearch" }
tau-ext-xmpp = { path = "crates/tau-ext-xmpp" }
tau-harness = { path = "crates/tau-harness" }
tau-harness-tools = { path = "crates/tau-harness-tools" }
tau-proto = { path = "crates/tau-proto" }
tau-provider = { path = "crates/tau-provider" }
tau-provider-chat-completions = { path = "crates/tau-provider-chat-completions" }
tau-provider-codex = { path = "crates/tau-provider-codex" }
tau-session-inspect = { path = "crates/tau-session-inspect" }
tau-skills = { path = "crates/tau-skills" }
tau-socket = { path = "crates/tau-socket" }
tau-supervisor = { path = "crates/tau-supervisor" }
tau-term-screen = { path = "crates/tau-term-screen" }
tau-test-support = { path = "crates/tau-test-support" }
tau-themes = { path = "crates/tau-themes" }
tau-vcr = { path = "crates/tau-vcr" }

# External crates
async-imap = { version = "0.11", default-features = false, features = [
  "runtime-tokio",
] }
backon = { version = "1", default-features = false, features = [
  "std",
  "std-blocking-sleep",
] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
blake3 = { version = "1", default-features = false, features = ["std"] }
bon = { version = "3", default-features = false }
built = { version = "0.8", default-features = false, features = [
  "chrono",
  "git2",
] }
calcard = { version = "0.3.4", default-features = false }
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
clap = { version = "4", default-features = false, features = [
  "color",
  "derive",
  "error-context",
  "help",
  "std",
  "suggestions",
  "usage",
] }
comfy-table = { version = "7", default-features = false }
config = { version = "0.15", default-features = false, features = ["yaml"] }
crossterm = { version = "0.28", default-features = false, features = [
  "bracketed-paste",
  "events",
] }
dialoguer = { version = "0.11", default-features = false }
dirs = { version = "6", default-features = false }
fs2 = { version = "0.4", default-features = false }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
globset = { version = "0.4", default-features = false }
handlebars = { version = "6", default-features = false }
ignore = { version = "0.4", default-features = false }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
indexmap = { version = "2", default-features = false, features = ["serde"] }
ipnet = { version = "2", default-features = false, features = ["std"] }
json5 = { version = "0.4", default-features = false }
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "ring",
  "smtp-transport",
  "tokio1-rustls",
  "webpki-roots",
] }
libc = { version = "0.2", default-features = false }
listenfd = { version = "1.0.2", default-features = false }
lru = { version = "0.18", default-features = false }
mail-parser = { version = "0.11", default-features = false, features = [
  "full_encoding",
] }
nucleo-matcher = { version = "0.3.1", default-features = false, features = [
  "unicode-casefold",
  "unicode-normalization",
] }
opentelemetry-proto = { version = "0.32", default-features = false, features = [
  "gen-tonic-messages",
  "trace",
  "with-serde",
] }
parse_datetime = { version = "0.14", default-features = false }
rand = { version = "0.8", default-features = false, features = [
  "std",
  "std_rng",
] }
rcgen = { version = "0.13", default-features = false, features = [
  "crypto",
  "pem",
  "ring",
] }
regex = { version = "1", default-features = false, features = [
  "std",
  "unicode-perl",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
] }
rhai = { version = "1", default-features = false, features = ["serde", "std"] }
rrule = { version = "0.14", default-features = false }
rustix-openpty = { version = "0.2", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rustls-pemfile = { version = "2", default-features = false, features = ["std"] }
rustls-platform-verifier = { version = "0.7", default-features = false }
serde = { version = "1", default-features = false, features = [
  "derive",
  "std",
] }
serde_bytes = "0.11"
serde_json = { version = "1", default-features = false, features = [
  "raw_value",
  "std",
] }
serde_toon_format = "0.1.2"
serde_yaml_ng = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
similar = { version = "2", default-features = false, features = ["text"] }
socket2 = { version = "0.6", default-features = false }
tempfile = { version = "3", default-features = false }
time = { version = "0.3", default-features = false, features = [
  "formatting",
  "macros",
  "parsing",
] }
time-tz = { version = "2", default-features = false, features = ["db"] }
tokio = { version = "1", default-features = false, features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "tls12",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "connect",
  "handshake",
  "rustls-tls-native-roots",
] }
tokio-xmpp = { version = "6", default-features = false, features = [
  "direct-tls",
  "ring",
  "rustls-native-certs",
  "starttls",
] }
toml = { version = "0.9", default-features = false, features = [
  "display",
  "parse",
  "serde",
] }
tracing = { version = "0.1", default-features = false, features = [
  "attributes",
  "std",
] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "std",
] }
tungstenite = { version = "0.29", default-features = false, features = [
  "handshake",
  "rustls-tls-native-roots",
] }
unicode-segmentation = { version = "1", default-features = false }
unicode-width = { version = "0.2", default-features = false }
ureq = { version = "3", default-features = false, features = [
  "platform-verifier",
  "rustls",
] }
url = { version = "2", default-features = false }
uuid = { version = "1", default-features = false, features = ["std", "v8"] }
vt100 = { version = "0.16", default-features = false }
webpki-roots = { version = "1", default-features = false }
which = { version = "8", default-features = false, features = ["real-sys"] }
xmpp-parsers = { version = "0.23", default-features = false }

[profile.dev]
debug = false

[profile.dev.package."*"]
# Keep dependencies without debug information if the workspace profile is
# changed to "line-tables-only" for more useful workspace panic traces.
debug = false

[profile.ci]
debug = false
incremental = false
inherits = "dev"
lto = "off"

[profile.ci.package."*"]
# Keep dependencies without debug information if the workspace profile is
# changed to "line-tables-only" for more useful workspace panic traces.
debug = false

[profile.release]
# Keep the universal binary's whole-program optimization parallel. Fat LTO with
# one codegen unit made the final source-release build take several minutes.
# flake.nix asserts these values; see docs/release-builds.md.
codegen-units = 16
debug = false
lto = "thin"
panic = "abort"
strip = "symbols"
