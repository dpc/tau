id: unwrap-or-default
language: rust
severity: hint
rule:
  all:
    - pattern: $EXPR.unwrap_or_default()
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: "cfg\\(test\\)"
ignores:
  - "crates/**/tests/**"
  - "crates/**/benches/**"
  - "benches/**"
  - "tests/**"
  - "examples/**"
  - "tracehealth-api/tests/**"
  - "tracehealth-api/benches/**"
  - "**/test_utils.rs"
  - "vendor/**"
  - ".claude/worktrees/**"
  - "target/**"
  - "tracehealth-ios/**"
message: |
  Silent fallback — .unwrap_or_default() returns the Default value (empty
  string, zero, empty vec, etc.) if the Result or Option is empty/failed.
  On Results, this silently hides errors. Prefer .expect("reason"),
  .inspect_err(|e| warn!(%e, "context")).unwrap_or_default(), or ?.
