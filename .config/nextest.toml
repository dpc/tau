[profile.default]
slow-timeout = { period = "10s", terminate-after = 1 }

[[profile.default.overrides]]
# Two barrier-synchronized preview stacks each own a CLI, harness, and up to
# five configured extension children.
filter = "package(tau) & binary(dev_previews) & test(/^previews_omit_durable_session_artifacts_across_success_failure_and_concurrency$/)"
threads-required = 8

[[profile.default.overrides]]
# Ordinary preview tests own one nested CLI/harness/configured-extension stack.
filter = "package(tau) & binary(dev_previews)"
threads-required = 4

[[profile.default.overrides]]
# Each stdio fixture owns one harness plus its configured extension processes.
filter = "package(tau) & binary(initial_ui_stdio)"
threads-required = 4

[[profile.default.overrides]]
# These fixtures own nested public CLI/server, daemon/extension, and attached
# UI processes. Eight scheduler slots limit concurrent process stacks under
# CPU-constrained Nix builders without weakening the fixtures' 10-second
# synchronization deadlines.
filter = "package(tau) & binary(detach_attach_cli)"
threads-required = 8

[[profile.default.overrides]]
filter = "package(tau-e2e-tests) & binary(deterministic_provider)"
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(tau-e2e-tests) & binary(core_resume)"
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(tau-e2e-tests) & binary(core_shell_resume)"
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(tau-e2e-tests) & binary(cancellation_liveness)"
slow-timeout = { period = "15s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "package(tau-e2e-tests) & binary(provider_builtin_retry)"
slow-timeout = { period = "60s", terminate-after = 1 }

# LLVM coverage instrumentation makes the same test binaries materially slower.
# Keep that allowance isolated from ordinary developer and CI test runs.
[profile.coverage]
inherits = "default"
slow-timeout = { period = "20s", terminate-after = 1 }

[[profile.coverage.overrides]]
filter = "package(tau-e2e-tests) & binary(deterministic_provider)"
slow-timeout = { period = "120s", terminate-after = 1 }

[[profile.coverage.overrides]]
filter = "package(tau-e2e-tests) & binary(core_resume)"
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.coverage.overrides]]
filter = "package(tau-e2e-tests) & binary(core_shell_resume)"
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.coverage.overrides]]
filter = "package(tau-e2e-tests) & binary(cancellation_liveness)"
slow-timeout = { period = "30s", terminate-after = 1 }

[[profile.coverage.overrides]]
filter = "package(tau-e2e-tests) & binary(provider_builtin_retry)"
slow-timeout = { period = "120s", terminate-after = 1 }
