[package]
name = "tau-ext-shell"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Registers the test-only `echo` tool. Enabled automatically under
# `cfg(test)`; the `tau-harness` `echo-agent` feature forwards to this
# so echo-agent harness tests can exercise the tool dispatcher
# without a real model.
echo-agent = []

[dependencies]
base64.workspace = true
blake3.workspace = true
ciborium.workspace = true
dirs.workspace = true
fs2.workspace = true
globset.workspace = true
ignore.workspace = true
image.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tau-actions.workspace = true
tau-client.workspace = true
tau-proto.workspace = true
tau-skills.workspace = true
tau-vcr.workspace = true
tempfile.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
rustix-openpty.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
rustix-v1 = { workspace = true, features = ["alloc", "fs", "pty", "termios"] }

[dev-dependencies]
tau-core.workspace = true
