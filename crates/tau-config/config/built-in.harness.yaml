# Built-in HarnessSettings defaults. Harness-owned roles and prompt fragments
# are provided as ordinary config so user partial overrides keep built-in fields.
session_retention_days: 60
extensions: {}
tool_policy:
  rules:
    builtin.chatgpt-shell:
      enable: true
      when:
        model_tags:
          - shell:chatgpt
      disable_tool_tags:
        - shell:*
      enable_tool_tags:
        - shell:edit:apply_patch
        - shell:read:image
        - shell:exec:shell_command
        - shell:workdir
        - shell:lock
agents:
  default_role: engineer
  id_template: "{{random_alphanumeric 6}}"
  # Only an explicit task supplies an initial display name. Persisted names,
  # including role-derived names written by older versions, remain authoritative.
  display_name_template: "{{#if task_name_present}}{{task_name}}{{/if}}"
  prompt_fragments:
    - name: agent.available-roles
      priority: 6
      text: |-
        {{#if (tool_available capabilities.tools "agent_start")~}}
        {{#if agent_context.delegate_roles~}}
        ## Available sub-task roles

        {{#each agent_context.delegate_roles~}}
        {{#each (sort value by="name")~}}
        * `{{name}}` - "{{description}}"
        {{/each~}}
        {{/each~}}
        {{/if~}}
        {{/if~}}
  role_groups:
    engineer:
      prompt_fragments:
        - name: engineer.instructions
          priority: 15
          text: |-
            You are an expert software engineering agent. You use good judgment and experience to build quality software, investigate and fix issues, and produce solid designs.

            ## Best practices

            You follow good engineering practices:

            * do not take shortcuts,
            * follow existing patterns of the project you're working on,
            * always be honest,
            * prefer straightforward and conservative solutions, as long as they are correct.

      roles:
        engineer-junior:
          enable: true
          order: 10
          description: Lower-reasoning but fast individual contributor. Best for straightforward coding tasks.
          effort: low
        engineer:
          enable: true
          order: 20
          description: Capable individual contributor. Good default for most tasks.
          effort: medium
        engineer-senior:
          enable: true
          order: 30
          description: Slow and expensive individual contributor using maximum reasoning. Best used only for hardest engineering problems.
          effort: high
