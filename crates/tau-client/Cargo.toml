[package]
name = "dpc-tau-client"
version = "0.27.0"
edition.workspace = true
description = "Client runtime for standalone Tau extensions and UI protocol peers."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version = "1.91"
license.workspace = true

[lib]
name = "tau_client"

[lints]
workspace = true

[features]
# Build-script-only capture of owned Git provenance and Cargo freshness watches.
build = ["dep:git2"]

[dependencies]
blake3.workspace = true
ciborium.workspace = true
git2 = { version = "0.20", default-features = false, optional = true }
serde.workspace = true
tau-blocking-notify-channel.workspace = true
tau-proto.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
git2 = { version = "0.20", default-features = false }
serde_json.workspace = true
tempfile.workspace = true
