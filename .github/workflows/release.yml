name: Tagged Linux complete release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'dpc/tau'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve the tag to its immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse 'HEAD^{commit}')
          test "$source_sha" = "$SOURCE_SHA"
          python3 - "$SOURCE_SHA" "$RELEASE_TAG" <<'PY'
          import sys
          sys.path.insert(0, "packaging")
          import native
          native.require_sha(sys.argv[1])
          manifest = native.inventory(__import__("pathlib").Path("."), sys.argv[1])
          native.release_version(sys.argv[2], manifest["core"]["version"])
          PY
      - name: Build and package the complete tagged distribution
        shell: bash
        run: |
          python3 packaging/build.py \
            --repo "$GITHUB_WORKSPACE" \
            --source-sha "$SOURCE_SHA" \
            --workflow-sha "$SOURCE_SHA" \
            --arch "$PACKAGE_ARCH" \
            --output "$RUNNER_TEMP/native-release" \
            --maintainer 'Dawid Ciężarkiewicz <dpc@dpc.pw>' \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --release-tag "$RELEASE_TAG"
      - name: Stage uniquely named release assets
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          python3 packaging/release_assets.py stage \
            --source "$RUNNER_TEMP/native-release" \
            --output "$RUNNER_TEMP/release-assets" \
            --version "$version" --arch "$PACKAGE_ARCH"
      - name: Upload release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tau-${{ github.ref_name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false

  release:
    needs: build
    if: github.repository == 'dpc/tau'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Check out trusted tagged verification tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download all architecture assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tau-${{ github.ref_name }}-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - name: Verify and publish the GitHub release
        shell: bash
        run: |
          set -euo pipefail
          python3 packaging/publish.py \
            --repo "$GITHUB_REPOSITORY" \
            --source-repo "$GITHUB_WORKSPACE" \
            --source "$RUNNER_TEMP/release-assets" \
            --source-sha "$SOURCE_SHA" --workflow-sha "$SOURCE_SHA" \
            --tag "$RELEASE_TAG"
