# Provider extensions publish the live model list and model metadata at
# runtime. Harness config owns role defaults and extension settings.
# Use `/model <provider>/<model>` to switch the selected agent model and
# `/role ...` to edit persisted role overrides.

# Optional prompt fragments applied to every role. Fragments are rendered as
# Handlebars templates and sorted by priority together with role-, tool-, and
# extension-provided fragments. Templates can use `agent_id` when rendering a
# concrete agent prompt, `cwd`, `working_directory` (`present`, `path`,
# `basename`, `ancestors`), `eq`, and `starts_with` for project-specific
# conditionals. `tau dev print-prompt` role previews use the stable fake
# `dev-preview-agent` id, but reusable agent-id text should still be guarded
# with `{{#if agent_id}}`. Priorities below
# 100 render before generated context such as skills and AGENTS.md.
# prompt_fragments:
#   - name: user.short-plain-style
#     priority: 65
#     text: Keep answers short and plain, using only simple words.

# Optional startup role. If omitted, Tau starts on the first role in
# `role_groups` order after roles inside that group are sorted by `order` and
# then role name. If the named role is missing, Tau warns and falls back to that
# first role.
# default_role: senior-engineer

# Optional grouped role defaults. Role names are globally unique across all
# groups. Tab cycles roles within the current group; Shift-Tab cycles to the
# next role group. Group-level fields are defaults for every role in `roles`.
# Per-role `order` sorts roles within a group before role name; unordered roles
# sort after ordered roles by name.
# `description` is shown in `/role ...` completions. `compaction` controls
# provider-side automatic compaction: omit it or set `provider_default` for the
# provider's model-specific default, `disabled` to turn it off, or `{ threshold:
# 200000 }` for an explicit token threshold.
# Per-role `prompt_fragments` add instructions only for that role.
# `prompt_override` selects a system prompt template. `tools` and `disable_tools`
# customize internal tool availability for the role.
# role_groups:
#   engineer:
#     prompt_fragments:
#       - name: engineer.careful
#         priority: 80
#         text: You are a careful coding agent.
#     roles:
#       junior-engineer:
#         order: 10
#         effort: low
#       senior-engineer:
#         order: 20
#         description: Balanced coding engineer.
#         model: chatgpt/gpt-5.5
#         compaction: { threshold: 200000 }
#         tools: [read, grep]
#         disable_tools: [shell]
#       staff-engineer:
#         order: 30
#         effort: xhigh
#       old-role:
#         enable: false  # hide a lower-layer or built-in role

# Optional built-in extension overrides. Extension names may contain only ASCII
# letters, digits, `_`, and `-` so they are safe for state paths and dotted
# --harness-config overrides.
# extensions:
#   core-shell:
#     enable: false
#   provider-builtin:
#     enable: false
#   test-dummy:
#     enable: true
#   std-telegram:
#     enable: true
#     secrets:
#       telegram_bot_token: {}
#     config:
#       bot_token_secret: telegram_bot_token
#       allowed_user_ids: [123456789]
#       # Optional for a private chat; if omitted, send /start to link it.
#       chat_id: 123456789
#   std-xmpp:
#     enable: true
#     secrets:
#       xmpp_password: {}
#     config:
#       jid: tau@example.org
#       password_secret: xmpp_password
#       allowed_jids: [me@example.org]
#       default_recipient: me@example.org
#       routing: { mode: muc } # or: { mode: direct_resource }
#       muc:
#         service: conference.example.org
#         room_prefix: tau
#         # Recommended: configure Prosody/MUC defaults to create hidden,
#         # members-only rooms that expose real JIDs to Tau.
#         expose_real_jids: true
#         # Set true only when server-side room membership is the intended
#         # authorization boundary and real JIDs are intentionally hidden.
#         trust_muc_membership: false
#       # Default: 16384 bytes. Valid range: 1..=131072 (128 KiB).
#       max_message_bytes: 16384
#   std-pim:
#     enable: true
#     # Secret names may contain ASCII letters, digits, '.', '_' and '-'.
#     # Values come from <state_dir>/secrets/<name>.yaml or one-shot
#     # TAU_SECRET_<NAME> environment variables (suffixes are lowercased and
#     # removed from the harness environment after startup).
#     secrets:
#       personal_mail_password: {}        # required by default
#       personal_calendar_ics_url: {}
#       google_calendar_client_id:
#         optional: true
#       google_calendar_client_secret:
#         optional: true
#       google_calendar_refresh_token:
#         optional: true
#       backup_mail_password:
#         optional: true                  # omit when no value is configured
#     config:
#       email:
#         enable: true
#         accounts:
#           - id: personal
#             enable: true
#             from: "Me <me@example.com>"
#             imap: { host: imap.example.com, login: me@example.com }
#             smtp: { host: smtp.example.com, login: me@example.com }
#             auth:
#               method: password
#               # Replace legacy auth.password_env/auth.command/password_command
#               # with auth.password_secret plus the declaration above.
#               password_secret: personal_mail_password
#       calendar:
#         enable: true
#         accounts:
#           - id: personal-calendar
#             enable: true
#             backend:
#               type: ics_feed
#               url_secret: personal_calendar_ics_url
#             calendars:
#               default: main
#               allow: [main]
#           # Google read/write support can use /calendar auth google to
#           # store OAuth in private extension state, or a manual refresh-token
#           # secret for power users. Mutations queue under /calendar change by
#           # default.
#           - id: google-calendar
#             enable: false
#             backend:
#               type: google
#               client_id_secret: google_calendar_client_id
#               client_secret_secret: google_calendar_client_secret
#               # Omit refresh_token_secret and run:
#               #   /calendar auth google start google-calendar
#               #   /calendar auth google finish google-calendar
#               # refresh_token_secret: google_calendar_refresh_token
#             calendars:
#               default: primary
#               allow: [primary]
#         policy:
#           read:
#             private_events: busy_only
#             descriptions: approved_only
#           write:
#             require_approval: true
