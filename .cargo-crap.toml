# Shared cargo-crap defaults for local runs and CI gates.
# Policy: GATE-cargo-crap-gates.
#
# CI still supplies derivation-specific workspace selection, LCOV, output,
# format, and per-job cutoffs via CLI arguments where those differ between
# jobs. CLI arguments take precedence over this file.
# External cfg(test) modules lose their parent attribute during per-file scans.
# Keep the production gate, debt report, and duplicate inventory on one scope.
default-excludes = [
  "**/*_tests.rs",
  "**/tests.rs",
  "**/tests/**",
  "benches/**",
  "examples/**",
  "tests/**",
]
epsilon = 0.01
missing = "pessimistic"
sort = "crap"
threshold = 400
# Show uncovered instrumented line ranges in the human/Markdown debt reports.
# This does not change scores or the GitHub-format blocking gate.
uncovered-hints = true
